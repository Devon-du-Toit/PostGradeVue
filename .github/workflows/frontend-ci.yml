name: Frontend CI

on:
  push:
  pull_request:

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check linting
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --run

  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        # Placeholder: production builds require an API URL (vite.config.ts);
        # CI only checks that the bundle builds.
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgrade
          POSTGRES_USER: postgrade_user
          POSTGRES_PASSWORD: postgrade_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Devon-du-Toit/PostGradeDjango
          # Review the coordinated script-only API/client changes together.
          # On master, use the merged backend as usual.
          ref: ${{ (github.head_ref || github.ref_name) == 'feature/verified-script-delivery' && 'feature/verified-script-delivery' || 'master' }}
          path: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # same as the backend and its CI

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          DB_NAME: postgrade
          DB_USER: postgrade_user
          DB_PASSWORD: postgrade_password
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: 'True'
          SECRET_KEY: e2e-ci-secret-key
        run: python manage.py migrate

      - name: Create E2E lecturer
        working-directory: backend
        env:
          DB_NAME: postgrade
          DB_USER: postgrade_user
          DB_PASSWORD: postgrade_password
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: 'True'
          SECRET_KEY: e2e-ci-secret-key
        run: >
          python manage.py shell -c
          "from django.contrib.auth import get_user_model;
          User = get_user_model();
          User.objects.create_user(email='e2e.lecturer@example.com', password='TestPass123!')"

      - name: Seed sandbox email scenarios
        working-directory: backend
        env:
          DB_NAME: postgrade
          DB_USER: postgrade_user
          DB_PASSWORD: postgrade_password
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: 'True'
          SECRET_KEY: e2e-ci-secret-key
          POSTGRADE_EMAIL_E2E: '1'
        run: python ../e2e/seed_email_fixtures.py

      - name: Start Django backend
        working-directory: backend
        env:
          DB_NAME: postgrade
          DB_USER: postgrade_user
          DB_PASSWORD: postgrade_password
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: 'True'
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
          EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
          SECRET_KEY: e2e-ci-secret-key
        run: python manage.py runserver 127.0.0.1:8000 &

      # Uploads wait in "processing" until the recognition worker runs them.
      - name: Start recognition worker
        working-directory: backend
        env:
          DB_NAME: postgrade
          DB_USER: postgrade_user
          DB_PASSWORD: postgrade_password
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: 'True'
          SECRET_KEY: e2e-ci-secret-key
        run: python manage.py run_recognition_worker &

      - name: Run Playwright E2E tests
        run: npm run test:e2e
